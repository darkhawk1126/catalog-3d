<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1e; }
    #canvas { display: block; width: 100%; height: 100%; }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #9ca3af;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      pointer-events: none;
    }
    #status.hidden { display: none; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #374151;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-msg {
      color: #f87171;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
      display: none;
    }
    #error-msg.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status" role="status" aria-live="polite">
    <div class="spinner" id="spinner"></div>
    <span id="status-text">Loading model…</span>
    <span id="error-msg"></span>
  </div>
  <script>
    // Geometry URL is injected server-side before the bundle runs.
    window.__CATALOG3D_GEOMETRY_URL__ = '{{GEOMETRY_URL}}';
  </script>
  <script>
    // Vendored three.js + STLLoader + viewer logic — inline bundle, no CDN dependency.
    {{BUNDLE}}
  </script>
</body>
</html>
