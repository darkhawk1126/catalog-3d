services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5036:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Override connection string to use the compose postgres service
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=catalog3d;Username=catalog;Password=catalog_dev"
      Storage__Root: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog3d
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog3d"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
