---
# Local Authelia 4.39.13 dev configuration for catalog-3d.
# Mirrors prod claim shape: no claims_policy, groups delivered via UserInfo endpoint only.
# Uses TLS (self-signed cert) because Authelia 4.39 requires https for session.cookies.authelia_url.
# The app sets Oidc:RequireHttpsMetadata=false so it accepts the self-signed cert on the backend.
# Browser users will see a cert warning on first visit to https://127.0.0.1:9091 — accept it once.

theme: light

server:
  address: tcp://0.0.0.0:9091/
  tls:
    key: /config/tls.key
    certificate: /config/tls.crt

log:
  level: info

# 32-char dev-only secrets. Not sensitive — single-instance local only.
identity_validation:
  reset_password:
    jwt_secret: "dev-jwt-secret-32bytes-paddddddd"

session:
  secret: "dev-session-secret-32bytes-paddd"
  cookies:
    - domain: 127.0.0.1
      authelia_url: https://127.0.0.1:9091
      name: authelia_session
      expiration: 1h
      inactivity: 5m

storage:
  encryption_key: "dev-storage-key-32bytes-padddddd"
  local:
    path: /config/db.sqlite3

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      parallelism: 4
      memory: 65536
      key_length: 32
      salt_length: 16

# Everyone through on one factor — catalog-3d owns its own authorization.
access_control:
  default_policy: one_factor

notifier:
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    hmac_secret: "dev-hmac-secret-32bytes-padddddd"
    jwks:
      - key_id: dev-rsa
