    clients:
      - client_id: catalog-3d
        client_name: "catalog-3d (dev)"
        # argon2id hash of plaintext "catalog-dev-secret"
        # Plaintext is set in docker-compose via OIDC__ClientSecret.
        client_secret: "$argon2id$v=19$m=65536,t=3,p=4$iWoBK7UYiYkCKIMpVdLuPw$BPfRkSzzjRw+U8viRfbqhBSPmjMx0lCXq07AAfbYeSo"
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_post
        authorization_policy: one_factor
        # No claims_policy: groups are NOT embedded in the ID token.
        # The ASP.NET Core OIDC handler must use GetClaimsFromUserInfoEndpoint=true.
        # This mirrors prod exactly.
        scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        redirect_uris:
          - http://127.0.0.1:5036/signin-oidc
        # userinfo_signed_response_alg omitted: plain JSON UserInfo response (default = none).
